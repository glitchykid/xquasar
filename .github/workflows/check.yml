name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t xquasar-dev .
      - run: docker run --rm --network=none xquasar-dev

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the source archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/$TAG.md"
          test -s "$notes"
          archive="$RUNNER_TEMP/xquasar-$TAG.tar.gz"
          git archive --format=tar.gz --prefix="xquasar-$TAG/" --output="$archive" HEAD
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/xquasar-$TAG" && python3 -m xquasar --help)
          package="$RUNNER_TEMP/xquasar.deb"
          sh packaging/build-deb.sh "${TAG#v}" "$package"
          sudo apt-get update -qq
          sudo apt-get install -y "$package" xvfb xauth xdotool flatpak
          xvfb-run -a /usr/bin/python3 packaging/test-desktop.py
          gh release create "$TAG" "$archive" "$package" --verify-tag --title "XQuasar $TAG" --notes-file "$notes"
